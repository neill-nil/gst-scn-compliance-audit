<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NoticeCheck review</title>
<style>
  :root { --bg:#f6f6f4; --panel:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#ddd; --hl:#fff1a8; --hl2:#ffc56b;
          --ok:#1f7a3a; --bad:#b3261e; --warn:#8a5a00; --accent:#2a5bd7; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; color:var(--ink); background:var(--bg); }
  #app { display:grid; grid-template-columns:230px 1fr 1fr; height:100vh; }
  #side, #judgment, #form { overflow-y:auto; padding:12px; }
  #side { border-right:1px solid var(--line); background:var(--panel); }
  #judgment { border-right:1px solid var(--line); background:var(--panel); }
  h2 { font-size:15px; margin:14px 0 6px; } h2:first-child { margin-top:0; }
  .q { display:block; width:100%; text-align:left; border:1px solid transparent; background:none; padding:5px 6px;
       border-radius:6px; cursor:pointer; font:inherit; }
  .q:hover { background:#f0f0ec; } .q.cur { border-color:var(--accent); background:#eef3ff; }
  .q small { color:var(--muted); display:block; }
  .tag { font-size:11px; padding:0 5px; border-radius:8px; background:#eee; margin-left:4px; }
  .tag.second { background:#e6dcff; } .tag.done { background:#d6f0dc; } .tag.needs_fix,.tag.in_progress { background:#ffe7c2; }
  .tag.out_of_scope { background:#e5e5e5; }
  .para { padding:6px 8px; border-radius:6px; margin-bottom:4px; scroll-margin-top:40px; }
  .para b { color:var(--muted); font-weight:600; margin-right:4px; }
  .para.flash { outline:2px solid var(--hl2); }
  mark { background:var(--hl); padding:0 1px; } mark.on { background:var(--hl2); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:10px; }
  .card.unticked { border-left:4px solid var(--warn); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:6px; }
  label { font-size:13px; } select, input[type=number], input[type=text] { font:inherit; padding:3px 5px; }
  textarea { width:100%; font:12.5px/1.4 ui-monospace, monospace; padding:6px; }
  .quote textarea { font:13px/1.4 system-ui, sans-serif; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .muted { color:var(--muted); }
  button.small { font-size:12px; padding:1px 7px; cursor:pointer; }
  #bar { position:sticky; bottom:0; background:var(--bg); padding:8px 0; border-top:1px solid var(--line); }
  #bar button { font:inherit; padding:6px 12px; margin-right:6px; cursor:pointer; }
  #primary { background:var(--accent); color:#fff; border:0; border-radius:6px; }
  #primary:disabled { opacity:.4; cursor:not-allowed; }
  #problems li { margin-bottom:3px; }
  .help { color:var(--muted); font-size:12.5px; }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <h2>Reviewer</h2>
    <select id="reviewer"><option value="">pick…</option><option>r1</option><option>r2</option><option>r3</option><option>r4</option></select>
    <h2>Your cases <span id="count" class="muted"></span></h2>
    <div id="queue" class="help">Pick your reviewer id.</div>
  </div>
  <div id="judgment"><p class="help">The judgment appears here. Quotes are highlighted; click "show" next to a quote to jump to it.</p></div>
  <div id="form"></div>
</div>
<script>
const $ = s => document.querySelector(s);
let data = null, rec = null, ticks = {}, factsTick = false, scope = null, started = 0, checkTimer = null, lastCheck = null;

function esc(s) { return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function attr(s) { return esc(s).replace(/"/g, "&quot;"); }
async function api(path, body) {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  const j = await r.json();
  if (!r.ok) { alert(j.error || "error"); throw new Error(j.error); }
  return j;
}

// ---------- queue ----------
async function loadQueue() {
  const rv = $("#reviewer").value;
  try { localStorage.setItem("reviewer", rv); } catch (e) {}
  if (!rv) return;
  const rows = await api(`/api/queue?reviewer=${rv}`);
  const done = rows.filter(r => r.done === "reviewed" || r.done === "out_of_scope").length;
  $("#count").textContent = `${done}/${rows.length} done`;
  $("#queue").innerHTML = rows.map(r => `
    <button class="q ${data && data.meta.cnr === r.cnr ? "cur" : ""}" onclick="openCase('${r.cnr}')">
      ${r.order}. ${r.cnr}${r.kind === "second" ? '<span class="tag second">2nd review</span>' : ""}
      ${r.done ? `<span class="tag ${r.done === "reviewed" ? "done" : r.done}">${r.done.replace(/_/g, " ")}</span>` : ""}
      <small>${esc(r.court_name)} · ${r.pages} pages</small></button>`).join("");
}

// ---------- case ----------
async function openCase(cnr) {
  const rv = $("#reviewer").value;
  $("#form").innerHTML = '<p class="help">Loading (reading the PDF)…</p>';
  data = await api(`/api/case?cnr=${cnr}&reviewer=${rv}`);
  rec = data.record;
  const st = rec.review && rec.review.status;
  const finished = data.saved && st === "reviewed";
  ticks = {}; (rec.findings.defects_argued || []).forEach((_, i) => ticks[i] = finished);
  factsTick = finished;
  scope = data.saved ? (st === "out_of_scope" ? "no" : "yes") : null;
  started = Date.now() - ((data.saved && rec.review.seconds) || 0) * 1000;
  lastCheck = data.check;
  renderForm(); renderJudgment(); loadQueue();
  $("#judgment").scrollTop = 0;
}

function quoteRegex(q) {
  const quoteChars = "[‘’‚‛„‟“”\"`´′″']", dashChars = "[–—‐‑−-]";
  const words = q.trim().split(/\s+/).map(w => esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")
      .replace(/[‘’‚‛„‟“”"`´′″']/g, quoteChars).replace(/[–—‐‑−-]/g, dashChars));
  try { return new RegExp(words.join("\\s*"), "g"); } catch (e) { return null; }
}

function renderJudgment(active) {
  const byPara = {};
  (lastCheck ? lastCheck.quotes : []).forEach(q => q.found_in.forEach(n => (byPara[n] = byPara[n] || []).push(q.quote)));
  $("#judgment").innerHTML = `<h2>${esc(data.meta.title || data.meta.cnr)}</h2>
    <p class="help">${esc(data.meta.court_name || "")} · ${esc(data.meta.cnr)} · PDF: data/raw/…/${esc(data.meta.cnr)}.pdf</p>` +
    data.paragraphs.map(p => {
      let t = esc(p.text);
      (byPara[p.n] || []).forEach(q => {
        const re = quoteRegex(q);
        if (re) t = t.replace(re, m => `<mark class="${q === active ? "on" : ""}">${m}</mark>`);
      });
      return `<div class="para" id="p-${p.n}"><b>[${p.n}]</b>${t}</div>`;
    }).join("");
}

function show(quote, para) {
  const hit = lastCheck && lastCheck.quotes.find(q => q.quote === quote);
  const n = hit && hit.found_in.length ? hit.found_in[0] : para;
  renderJudgment(quote);
  const el = document.getElementById(`p-${n}`);
  if (el) { el.scrollIntoView({block: "center"}); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1500); }
}

function quoteStatus(quote) {
  if (!quote) return "";
  const hit = lastCheck && lastCheck.quotes.find(q => q.quote === quote);
  if (!hit) return '<span class="muted">checking…</span>';
  return hit.found_in.length ? `<span class="ok">✓ found in para ${hit.found_in.join(", ")}</span>` : '<span class="bad">✗ not found word for word</span>';
}

// ---------- form ----------
const FINDINGS = ["defect_found", "defect_rejected", "not_decided"];

function renderForm() {
  const f = rec.findings, o = f.outcome;
  const flagged = data.draft_checks && (data.draft_checks.quotes_not_found.length || data.draft_checks.schema_problems.length);
  $("#form").innerHTML = `
    <h2>1. Is this case in scope?</h2>
    <div class="card">
      <div class="help">Yes = a GST demand under s.73/74 (tax periods up to 2023-24) AND the court rules on, or is asked to rule on, at least one procedural complaint. No = anything else (refund, registration, s.74A, pure consent remand with no complaint argued, not a GST demand).</div>
      <div class="row"><label><input type="radio" name="scope" value="yes" ${scope === "yes" ? "checked" : ""} onchange="setScope('yes')"> Yes, review it</label>
      <label><input type="radio" name="scope" value="no" ${scope === "no" ? "checked" : ""} onchange="setScope('no')"> No, out of scope</label></div>
      ${flagged ? '<div class="bad">The draft was flagged: some quotes or rules failed. See the red marks below.</div>' : ""}
    </div>
    <div id="body" style="${scope === "no" ? "display:none" : ""}">
    <h2>2. Complaints and the court's finding <span class="help">(check every one)</span></h2>
    ${f.defects_argued.map((d, i) => findingCard(d, i)).join("")}
    <button class="small" onclick="addDefect()">+ add a complaint the model missed</button>
    <h2>3. Outcome</h2>
    <div class="card">
      <div class="row"><label>disposition <select onchange="rec.findings.outcome.disposition=this.value; changed()">
        ${data.enums.disposition.map(v => `<option ${v === o.disposition ? "selected" : ""}>${v}</option>`).join("")}</select></label>
      <label><input type="checkbox" ${o.remanded ? "checked" : ""} onchange="rec.findings.outcome.remanded=this.checked; changed()"> remanded (sent back to the officer)</label>
      <label>para <input type="number" style="width:60px" value="${o.para ?? ""}" onchange="rec.findings.outcome.para=this.value===''?null:+this.value; changed()"></label></div>
      <div class="quote"><textarea rows="2" onchange="rec.findings.outcome.quote=this.value; changed()">${esc(o.quote)}</textarea></div>
      <div class="row"><span id="qs-outcome">${quoteStatus(o.quote)}</span> <button class="small" onclick="show(rec.findings.outcome.quote, rec.findings.outcome.para)">show</button></div>
    </div>
    <h2>4. Facts <span class="help">(quick check)</span></h2>
    <div class="card">
      <div class="help">Check that each value is right and its quote supports it. Fill in a fact the model left empty if the judgment states it. If a quote can't be found word for word, replace it with the exact text, or set the value and quote to null (no verified quote, no gold). Edit the JSON directly.</div>
      <div id="factquotes"></div>
      <textarea id="facts" rows="18" oninput="factsEdited(this)">${esc(JSON.stringify(rec.facts, null, 1))}</textarea>
      <div id="factserr" class="bad"></div>
      <label><input type="checkbox" ${factsTick ? "checked" : ""} onchange="factsTick=this.checked; renderBar()"> I quick-checked the facts</label>
    </div>
    </div>
    <h2>Notes</h2>
    <textarea id="notes" rows="2" placeholder="Anything odd about this case, or why it is out of scope">${esc((rec.review && rec.review.notes) || "")}</textarea>
    <div id="bar"></div>`;
  renderFactQuotes(); renderBar();
}

function findingCard(d, i) {
  return `<div class="card ${ticks[i] ? "" : "unticked"}">
    <div class="row"><select onchange="setD(${i},'type',this.value)">
      ${data.enums.type.map(v => `<option ${v === d.type ? "selected" : ""}>${v}</option>`).join("")}</select>
      ${FINDINGS.map(v => `<label><input type="radio" name="f${i}" ${v === d.finding ? "checked" : ""} onchange="setD(${i},'finding','${v}')"> ${v.replace("defect_", "")}</label>`).join("")}
    </div>
    <div class="row">
      <label><input type="checkbox" ${d.contested ? "checked" : ""} onchange="setD(${i},'contested',this.checked)"> contested</label>
      <label>quote from <select onchange="setD(${i},'quote_source',this.value)">
        ${["court", "argument"].map(v => `<option ${v === d.quote_source ? "selected" : ""}>${v}</option>`).join("")}</select></label>
      <label>para <input type="number" style="width:60px" value="${d.para ?? ""}" onchange="setD(${i},'para',this.value===''?null:+this.value)"></label>
      ${d.type === "other_procedural" ? `<label>note <input type="text" maxlength="120" value="${attr(d.note)}" onchange="setD(${i},'note',this.value||null)"></label>` : ""}
    </div>
    <div class="quote"><textarea rows="3" onchange="setD(${i},'quote',this.value)">${esc(d.quote)}</textarea></div>
    <div class="row"><span id="qs-${i}">${quoteStatus(d.quote)}</span>
      <button class="small" onclick="show(rec.findings.defects_argued[${i}].quote, rec.findings.defects_argued[${i}].para)">show</button>
      <button class="small" onclick="delDefect(${i})">delete</button>
      <label style="margin-left:auto"><input type="checkbox" ${ticks[i] ? "checked" : ""} onchange="ticks[${i}]=this.checked; renderForm()"> <b>checked against the judgment</b></label>
    </div></div>`;
}

function setScope(v) { scope = v; renderForm(); }
function setD(i, key, val) {
  const d = rec.findings.defects_argued[i];
  d[key] = val;
  if (key === "type") { d.note = val === "other_procedural" ? (d.note || "") : null; renderForm(); }
  changed();
}
function addDefect() {
  rec.findings.defects_argued.push({type: "hearing_75_4", note: null, finding: "not_decided", contested: false, quote: "", quote_source: "court", para: null});
  ticks[rec.findings.defects_argued.length - 1] = false; renderForm(); changed();
}
function delDefect(i) {
  if (!confirm("Delete this complaint? Do this only if the petitioner never argued it.")) return;
  rec.findings.defects_argued.splice(i, 1);
  const t = {}; Object.keys(ticks).forEach(k => { k = +k; if (k < i) t[k] = ticks[k]; else if (k > i) t[k - 1] = ticks[k]; });
  ticks = t; renderForm(); changed();
}
function factsEdited(el) {
  try { rec.facts = JSON.parse(el.value); $("#factserr").textContent = ""; changed(); }
  catch (e) { $("#factserr").textContent = "JSON error: " + e.message; renderBar(); }
}

function renderFactQuotes() {
  const el = $("#factquotes");
  if (!el || !lastCheck) return;
  el.innerHTML = lastCheck.quotes.filter(q => q.where.startsWith("facts")).map(q => `
    <div class="row" style="margin-bottom:2px"><span class="${q.found_in.length ? "ok" : "bad"}">${q.found_in.length ? "✓" : "✗"}</span>
    <span class="help">${esc(q.where.replace(/^facts\./, ""))}</span>
    <button class="small" onclick='show(${JSON.stringify(q.quote).replace(/'/g, "&#39;")}, ${q.para ?? "null"})'>show</button></div>`).join("");
}

function changed() {
  clearTimeout(checkTimer);
  checkTimer = setTimeout(async () => {
    lastCheck = await api("/api/check", {record: rec});
    const f = rec.findings;
    f.defects_argued.forEach((d, i) => { const s = document.getElementById(`qs-${i}`); if (s) s.innerHTML = quoteStatus(d.quote); });
    const so = $("#qs-outcome"); if (so) so.innerHTML = quoteStatus(f.outcome.quote);
    renderFactQuotes(); renderJudgment(); renderBar();
  }, 500);
  renderBar();
}

function blockers() {
  const b = [];
  if (scope === null) b.push("Answer question 1 (in scope?).");
  if (scope === "no") return b;
  rec.findings.defects_argued.forEach((d, i) => { if (!ticks[i]) b.push(`Complaint ${i + 1} (${d.type}) not ticked as checked.`); });
  if (!factsTick) b.push("Facts not ticked as quick-checked.");
  if ($("#factserr") && $("#factserr").textContent) b.push("Facts JSON has an error.");
  if (lastCheck) {
    lastCheck.problems.forEach(p => b.push(p));
    lastCheck.quotes.filter(q => !q.found_in.length).forEach(q => b.push(`Quote not found word for word: ${q.where}`));
  }
  return b;
}

function renderBar() {
  const b = blockers();
  $("#bar").innerHTML = `
    ${b.length ? `<ul id="problems" class="bad">${b.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : '<p class="ok">All checks pass.</p>'}
    ${scope === "no"
      ? '<button id="primary" onclick="save(\'out_of_scope\')">Save as out of scope</button>'
      : `<button id="primary" ${b.length ? "disabled" : ""} onclick="save('reviewed')">Save as reviewed</button>`}
    <button onclick="save('in_progress')">Save, finish later</button>
    <span class="muted">${Math.round((Date.now() - started) / 60000)} min on this case</span>`;
}

async function save(status) {
  const notes = $("#notes").value;
  if (status === "out_of_scope" && !notes.trim()) { alert("Say in Notes why it is out of scope."); return; }
  const r = await api("/api/save", {reviewer: $("#reviewer").value, kind: data.meta.kind || "first", status,
                                    notes, seconds: Math.round((Date.now() - started) / 1000), record: rec});
  await loadQueue();
  if (r.status !== status) { alert(`Saved as "${r.status}": fix the red items, then save again.`); return; }
  const next = [...document.querySelectorAll(".q")].find(el => !el.querySelector(".tag.done, .tag.out_of_scope"));
  if (status !== "in_progress" && next) next.click();
}

$("#reviewer").onchange = loadQueue;
try { $("#reviewer").value = localStorage.getItem("reviewer") || ""; } catch (e) {}
loadQueue();
setInterval(() => { if (data) renderBar(); }, 60000);
</script>
</body>
</html>
